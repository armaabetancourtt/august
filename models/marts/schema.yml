version: 2
models:
  - name: fct_property_monthly
    description: Historical monthly property-event aggregates.
    columns:
      - name: property_id
        data_tests: [not_null]
      - name: event_month
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['listing','sale','rental']
      - name: event_count
        data_tests: [not_null]
